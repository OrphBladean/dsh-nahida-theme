<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="纳西妲主题 dsh-nahida-theme — 四叶草徽记、聊天壁纸与草元素配色，made with DeepSeek Harness">
  <defs>
    <linearGradient id="nhb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a11"/>
      <stop offset="0.55" stop-color="#14331d"/>
      <stop offset="1" stop-color="#22502d"/>
    </linearGradient>
    <radialGradient id="nhb-glow" cx="79%" cy="38%" r="56%">
      <stop offset="0" stop-color="#9adb6e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9adb6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nhb-rule" x1="0" x2="1">
      <stop offset="0" stop-color="#9adb6e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9adb6e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9adb6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nhb-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe89a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3e7c3a" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#nhb-bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#nhb-glow)"/>
  <circle cx="1080" cy="338" r="150" fill="#9adb6e" opacity="0.05"/>
  <circle cx="150" cy="30" r="100" fill="#a6dd7e" opacity="0.05"/>

  <!-- 抽象壁纸卡片（不是截图，只是主题元素示意） -->
  <g opacity="0.55">
    <rect x="842" y="230" width="108" height="74" rx="14" fill="url(#nhb-card)" stroke="#9adb6e" stroke-opacity="0.25"/>
    <rect x="968" y="230" width="108" height="74" rx="14" fill="url(#nhb-card)" stroke="#9adb6e" stroke-opacity="0.35"/>
    <path d="M860 286c8-18 20-28 38-34-6 16-18 27-38 34z" fill="#a6dd7e" opacity="0.65"/>
    <path d="M988 286c8-18 20-28 38-34-6 16-18 27-38 34z" fill="#6dbe4e" opacity="0.65"/>
  </g>

  <!-- 四叶草徽记 -->
  <g transform="translate(1002 150) scale(7.2)">
    <g stroke="#cfe8b8" stroke-width="1.4" stroke-linejoin="round">
      <path d="M0 0C-2.4-3.2-9.6-7-9.6-13.2C-9.6-18-5-20.4 0-15.6C5-20.4 9.6-18 9.6-13.2C9.6-7 2.4-3.2 0 0Z" fill="#6dbe4e"/>
      <path d="M0 0C-2.4-3.2-9.6-7-9.6-13.2C-9.6-18-5-20.4 0-15.6C5-20.4 9.6-18 9.6-13.2C9.6-7 2.4-3.2 0 0Z" transform="rotate(90)" fill="#a6dd7e"/>
      <path d="M0 0C-2.4-3.2-9.6-7-9.6-13.2C-9.6-18-5-20.4 0-15.6C5-20.4 9.6-18 9.6-13.2C9.6-7 2.4-3.2 0 0Z" transform="rotate(180)" fill="#6dbe4e"/>
      <path d="M0 0C-2.4-3.2-9.6-7-9.6-13.2C-9.6-18-5-20.4 0-15.6C5-20.4 9.6-18 9.6-13.2C9.6-7 2.4-3.2 0 0Z" transform="rotate(270)" fill="#a6dd7e"/>
    </g>
    <circle r="3.2" fill="#e8c87a" stroke="#d2a64f" stroke-width="0.8"/>
    <path d="M0 2c0 6 1.4 11 5 15" fill="none" stroke="#4f8f3f" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 文案 -->
  <text x="72" y="112" fill="#9adb6e" font-size="17" letter-spacing="6" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">DSH THEME · 草元素</text>
  <text x="70" y="196" fill="#f4fbe9" font-size="66" font-weight="700" letter-spacing="3" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">纳西妲主题</text>
  <text x="72" y="246" fill="#cbe7a8" font-size="21" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">四叶草徽记 · 聊天壁纸 · 祝福语 · 飘落叶片</text>

  <line x1="72" y1="286" x2="540" y2="286" stroke="url(#nhb-rule)" stroke-width="1.2"/>

  <g>
    <rect x="72" y="308" width="340" height="38" rx="19" fill="#9adb6e" opacity="0.14"/>
    <rect x="72" y="308" width="340" height="38" rx="19" fill="none" stroke="#9adb6e" stroke-opacity="0.55"/>
    <text x="94" y="333" fill="#bfe89a" font-size="16" letter-spacing="1" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">Made with DSH · DSH 0.2.2-rc.5 verified</text>
  </g>

  <text x="72" y="374" fill="#7fa878" font-size="14" letter-spacing="1" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">dsh-nahida-theme · unofficial fan project · MIT</text>
</svg>
